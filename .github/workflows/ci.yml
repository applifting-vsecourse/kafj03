name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create env files
        run: pnpm env:check

      - name: Generate Prisma client
        run: pnpm backend prisma:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint backend
        run: pnpm backend lint:check

      - name: Lint frontend
        run: pnpm frontend lint:check

      - name: Type-check frontend
        run: pnpm frontend type-check

      - name: Test backend
        run: pnpm backend test

      - name: Test frontend
        run: pnpm frontend test:ci

      - name: Build backend
        run: pnpm backend build

      - name: Build frontend
        run: pnpm frontend build

  test-integration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://quacker:quacker@localhost:5432/quacker_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quacker
          POSTGRES_PASSWORD: quacker
          POSTGRES_DB: quacker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U quacker -d quacker_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend integration tests
        run: pnpm backend test:int

  test-e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://quacker:quacker@localhost:5432/quacker_e2e
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quacker
          POSTGRES_PASSWORD: quacker
          POSTGRES_DB: quacker_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U quacker -d quacker_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create env files
        run: pnpm env:check

      - name: Apply database migrations
        run: pnpm backend migrate

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright with backend and frontend
        run: pnpm test:e2e

  # Keep this check out of required status checks in branch protection/rulesets.
  test-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Check that changes to tests only add lines
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-test-changes.js "$PR_BASE"
